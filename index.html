    <script>
      (function() {
        // 1. Filter out benign Vite HMR WebSocket errors in AI Studio sandbox
        var origConsoleError = console.error;
        console.error = function() {
          var msg = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg instanceof Error) msg += ' ' + arg.message + ' ' + (arg.stack || '');
            else msg += ' ' + String(arg);
          }
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1 || msg.indexOf('vite-hmr') !== -1) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        // 2. Mock vite-hmr WebSocket client to prevent failed connection attempts
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('vite') !== -1))) {
              var listeners = {};
              var dummy = {
                readyState: 1, // OPEN
                url: url,
                protocol: protocols,
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { fn({ type: 'open' }); } catch(_) {}
                    }, 10);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
              return dummy;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('closed without opened') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // 3. Polyfills for older Android WebViews (Android 7/8/9/10/11 Vivo/Oppo/Samsung/Xiaomi)
        try {
          if (typeof window.globalThis === 'undefined') {
            window.globalThis = window;
          }
          if (!Array.prototype.at) {
            Array.prototype.at = function(n) {
              n = Math.trunc(n) || 0;
              if (n < 0) n += this.length;
              if (n < 0 || n >= this.length) return undefined;
              return this[n];
            };
          }
          if (!String.prototype.replaceAll) {
            String.prototype.replaceAll = function(str, newStr) {
              if (Object.prototype.toString.call(str).toLowerCase() === '[object regexp]') {
                return this.replace(str, newStr);
              }
              return this.split(str).join(newStr);
            };
          }
          if (!Object.hasOwn) {
            Object.hasOwn = function(obj, prop) {
              return Object.prototype.hasOwnProperty.call(obj, prop);
            };
          }
          if (!Promise.allSettled) {
            Promise.allSettled = function(promises) {
              return Promise.all(Array.from(promises).map(function(p) {
                return Promise.resolve(p).then(
                  function(v) { return { status: 'fulfilled', value: v }; },
                  function(r) { return { status: 'rejected', reason: r }; }
                );
              }));
            };
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
        } catch (_) {}
      })();
    </script>
