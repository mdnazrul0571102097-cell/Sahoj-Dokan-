name: Build Universal Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Sign Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Capacitor 6
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.3 --save-dev --legacy-peer-deps

      - name: Build Web App
        run: |
          npm run build

      - name: Generate Android Project, Restore Sahoj Dokan Icons & Configure Universal APK
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          # 1. Backup existing custom Sahoj Dokan icons & resources if present
          rm -rf /tmp/saved_android_res
          if [ -d "android/app/src/main/res" ]; then
            cp -r android/app/src/main/res /tmp/saved_android_res
          fi

          # 2. Generate clean Capacitor Android project (ensures gradle-wrapper.jar is created)
          rm -rf android
          node -e '
            const fs = require("fs");
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: "com.sahojdokan.app",
              appName: "Sahoj Dokan",
              webDir: "dist",
              android: { allowMixedContent: true }
            }, null, 2));
          '
          npx cap add android
          npx cap sync android

          # 3. Remove Capacitor default blue-X vector launcher icons so custom PNG icon is always shown
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/drawable-v24
          rm -f android/app/src/main/res/drawable/ic_launcher*

          # 4. Restore backed-up Sahoj Dokan icons & splash screens
          if [ -d "/tmp/saved_android_res" ]; then
            cp -r /tmp/saved_android_res/* android/app/src/main/res/ || true
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            rm -rf android/app/src/main/res/drawable-v24
            rm -f android/app/src/main/res/drawable/ic_launcher*
          fi

          # 5. Also generate all mipmap densities directly from Sahoj Dokan logo using ImageMagick
          ICON_SRC=""
          if [ -f "public/assets/icon.png" ]; then
            ICON_SRC="public/assets/icon.png"
          elif [ -f "assets/icon.png" ]; then
            ICON_SRC="assets/icon.png"
          elif [ -f "public/icon.png" ]; then
            ICON_SRC="public/icon.png"
          fi

          if [ -n "$ICON_SRC" ] && command -v convert >/dev/null 2>&1; then
            for pair in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
              dir="android/app/src/main/res/${pair%%:*}"
              sz="${pair##*:}"
              mkdir -p "$dir"
              convert "$ICON_SRC" -resize "${sz}x${sz}" "$dir/ic_launcher.png"
              convert "$ICON_SRC" -resize "${sz}x${sz}" "$dir/ic_launcher_round.png"
              convert "$ICON_SRC" -resize "${sz}x${sz}" "$dir/ic_launcher_foreground.png"
            done
          fi

          # 6. Create permanent deterministic keystore so every APK build shares the exact same signature
          KEYSTORE_B64=""
          echo "$KEYSTORE_B64" | base64 -d > android/app/sahojdokan.keystore

          # 7. Configure variables.gradle, app/build.gradle, MainActivity.java, and AndroidManifest.xml
          node -e '
            const fs = require("fs");
            const runNum = parseInt(process.env.RUN_NUM || "1", 10) || 1;
            const verCode = 100 + runNum;

            // Update variables.gradle
            const varsPath = "android/variables.gradle";
            if (fs.existsSync(varsPath)) {
              let vars = fs.readFileSync(varsPath, "utf8");
              vars = vars.replace(/minSdkVersion\s*=\s*\d+/, "minSdkVersion = 21");
              vars = vars.replace(/targetSdkVersion\s*=\s*\d+/, "targetSdkVersion = 33");
              vars = vars.replace(/compileSdkVersion\s*=\s*\d+/, "compileSdkVersion = 34");
              fs.writeFileSync(varsPath, vars, "utf8");
            }

            // Write clean universal app/build.gradle with v1+v2 signing and all 4 CPU ABIs
            const appGradlePath = "android/app/build.gradle";
            const cleanBuildGradle = `apply plugin: "com.android.application"

          android {
              namespace "com.sahojdokan.app"
              compileSdk rootProject.ext.compileSdkVersion

              signingConfigs {
                  universalKey {
                      storeFile file("sahojdokan.keystore")
                      storePassword "sahoj1234"
                      keyAlias "sahojdokan"
                      keyPassword "sahoj1234"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              defaultConfig {
                  applicationId "com.sahojdokan.app"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode ${verCode}
                  versionName "2.0.${runNum}"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  ndk {
                      abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                  }
                  aaptOptions {
                      ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
                  }
              }

              splits {
                  abi {
                      enable false
                  }
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.universalKey
                      minifyEnabled false
                      debuggable true
                  }
                  release {
                      signingConfig signingConfigs.universalKey
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
                  }
              }
          }

          repositories {
              flatDir {
                  dirs "../capacitor-cordova-android-plugins/src/main/libs", "libs"
              }
          }

          dependencies {
              implementation fileTree(include: ["*.jar"], dir: "libs")
              implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
              implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
              implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
              implementation project(":capacitor-android")
              testImplementation "junit:junit:$junitVersion"
              androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
              androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
              implementation project(":capacitor-cordova-android-plugins")
          }

          apply from: "capacitor.build.gradle"
          `;
            fs.writeFileSync(appGradlePath, cleanBuildGradle, "utf8");

            // Write MainActivity.java with native AndroidApp bridge
            const mainActDir = "android/app/src/main/java/com/sahojdokan/app";
            fs.mkdirSync(mainActDir, { recursive: true });
            const mainActCode = `package com.sahojdokan.app;

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          WebView webView = this.bridge.getWebView();
                          webView.getSettings().setJavaScriptEnabled(true);
                          webView.getSettings().setDomStorageEnabled(true);
                          webView.addJavascriptInterface(new AndroidAppBridge(this, webView), "AndroidApp");
                      }
                  } catch (Exception ignored) {}
              }

              public static class AndroidAppBridge {
                  private final Context context;
                  private final WebView webView;
                  private static final String PREF_NAME = "SahojDokanNativeBackup";

                  public AndroidAppBridge(Context context, WebView webView) {
                      this.context = context;
                      this.webView = webView;
                  }

                  @JavascriptInterface
                  public void openWhatsApp(String url) {
                      try {
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          context.startActivity(intent);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void printReceipt() {
                      if (webView == null) return;
                      webView.post(() -> {
                          try {
                              PrintManager printManager = (PrintManager) context.getSystemService(Context.PRINT_SERVICE);
                              if (printManager != null) {
                                  PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter("SahojDokan_Receipt");
                                  printManager.print("SahojDokan_Receipt", adapter, new PrintAttributes.Builder().build());
                              }
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public void saveBackupData(String payload) {
                      try {
                          SharedPreferences prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE);
                          prefs.edit().putString("latest_backup", payload).apply();
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public String loadBackupData() {
                      try {
                          SharedPreferences prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE);
                          return prefs.getString("latest_backup", "");
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public String loadBackupDataForPhone(String phone) {
                      try {
                          SharedPreferences prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE);
                          String byPhone = prefs.getString("backup_" + phone, "");
                          if (byPhone != null && !byPhone.isEmpty()) return byPhone;
                          return prefs.getString("latest_backup", "");
                      } catch (Exception e) {
                          return "";
                      }
                  }
              }
          }
          `;
            fs.writeFileSync(mainActDir + "/MainActivity.java", mainActCode, "utf8");

            // Write clean AndroidManifest.xml with extractNativeLibs="true" and usesCleartextTraffic="true"
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            const cleanManifest = `<?xml version="1.0" encoding="utf-8" ?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
              <uses-sdk
                  tools:overrideLibrary="com.getcapacitor.android,org.apache.cordova,androidx.webkit,androidx.activity,androidx.fragment,androidx.core,androidx.appcompat,androidx.coordinatorlayout,androidx.core.splashscreen"
              />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:extractNativeLibs="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|navigation|density"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="\${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
              </application>

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          </manifest>
          `;
            fs.writeFileSync(manifestPath, cleanManifest, "utf8");
          '

      - name: Build Universal APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SahojDokan-Universal.apk

      - name: Upload Signed Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: SahojDokan-Universal-APK
          path: android/app/build/outputs/apk/debug/*.apk
