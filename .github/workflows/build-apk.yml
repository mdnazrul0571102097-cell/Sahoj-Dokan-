name: Build Universal Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Sign Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Capacitor 6
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.3 --save-dev --legacy-peer-deps

      - name: Build Web App
        run: |
          npm run build
          # Remove chat screenshot attachments from dist so APK stays lightweight and fast
          rm -rf dist/assets/aistudio

      - name: Generate Android Project, Set Sahoj Dokan Icon & Configure Universal APK
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          rm -rf android
          node -e '
            const fs = require("fs");
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: "com.sahojdokan.app",
              appName: "Sahoj Dokan",
              webDir: "dist",
              android: { allowMixedContent: true }
            }, null, 2));
          '
          npx cap add android
          npx cap sync android

          # Remove Capacitor default blue-X adaptive vector icons so custom PNG icon is always used
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/drawable-v24
          rm -f android/app/src/main/res/drawable/ic_launcher*

          # Generate all mipmap launcher icons directly from Sahoj Dokan logo
          ICON_SRC=""
          if [ -f "public/assets/icon.png" ]; then
            ICON_SRC="public/assets/icon.png"
          elif [ -f "assets/icon.png" ]; then
            ICON_SRC="assets/icon.png"
          elif [ -f "public/icon.png" ]; then
            ICON_SRC="public/icon.png"
          fi

          if [ -n "$ICON_SRC" ] && command -v convert >/dev/null 2>&1; then
            for pair in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
              dir="android/app/src/main/res/${pair%%:*}"
              sz="${pair##*:}"
              mkdir -p "$dir"
              convert "$ICON_SRC" -resize "${sz}x${sz}" "$dir/ic_launcher.png"
              convert "$ICON_SRC" -resize "${sz}x${sz}" "$dir/ic_launcher_round.png"
              convert "$ICON_SRC" -resize "${sz}x${sz}" "$dir/ic_launcher_foreground.png"
            done
          fi

          # Install permanent backdated keystore (Valid from 2020-01-01 to 2050-01-01, no timezone/future-date conflict)
          KEYSTORE_B64=""
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          echo "$KEYSTORE_B64" | base64 -d > android/app/debug.keystore

          node -e '
            const fs = require("fs");
            const runNum = parseInt(process.env.RUN_NUM || "1", 10) || 1;
            const verCode = 300 + runNum;

            // 1. Update variables.gradle
            const varsPath = "android/variables.gradle";
            if (fs.existsSync(varsPath)) {
              let vars = fs.readFileSync(varsPath, "utf8");
              vars = vars.replace(/minSdkVersion\s*=\s*\d+/, "minSdkVersion = 21");
              vars = vars.replace(/targetSdkVersion\s*=\s*\d+/, "targetSdkVersion = 33");
              vars = vars.replace(/compileSdkVersion\s*=\s*\d+/, "compileSdkVersion = 34");
              fs.writeFileSync(varsPath, vars, "utf8");
            }

            // 2. Patch generated android/app/build.gradle cleanly
            const appGradlePath = "android/app/build.gradle";
            if (fs.existsSync(appGradlePath)) {
              let g = fs.readFileSync(appGradlePath, "utf8");
              g = g.replace(/versionCode\s+\d+/, "versionCode " + verCode);
              g = g.replace(/versionName\s+"[^"]+"/, "versionName \"3.0." + runNum + "\"");
              g = g.replace(
                /defaultConfig\s*\{/,
                "signingConfigs {\n        debug {\n            storeFile file(\"debug.keystore\")\n            storePassword \"android\"\n            keyAlias \"androiddebugkey\"\n            keyPassword \"android\"\n            v1SigningEnabled true\n            v2SigningEnabled true\n        }\n    }\n    splits {\n        abi {\n            enable false\n        }\n    }\n    defaultConfig {\n        ndk {\n            abiFilters \"armeabi-v7a\", \"arm64-v8a\", \"x86\", \"x86_64\"\n        }"
              );
              fs.writeFileSync(appGradlePath, g, "utf8");
            }

            // 3. Patch generated AndroidManifest.xml cleanly
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let m = fs.readFileSync(manifestPath, "utf8");
              if (!m.includes("xmlns:tools")) {
                m = m.replace(
                  "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">",
                  "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" xmlns:tools=\"http://schemas.android.com/tools\">\n    <uses-sdk tools:overrideLibrary=\"com.getcapacitor.android,org.apache.cordova,androidx.webkit,androidx.activity,androidx.fragment,androidx.core,androidx.appcompat,androidx.coordinatorlayout,androidx.core.splashscreen\" />"
                );
              }
              m = m.replace(
                "<application",
                "<application android:usesCleartextTraffic=\"true\""
              );
              fs.writeFileSync(manifestPath, m, "utf8");
            }
          '

      - name: Build Universal APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Signed Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SahojDokan-Universal-APK
          path: android/app/build/outputs/apk/debug/*.apk
