name: Build Universal Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

env:
  RUN_NUMBER: ${{ github.run_number }}

jobs:
  build:
    name: Build Universal Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Capacitor 6
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.3 --save-dev --legacy-peer-deps

      - name: Build Full Web Assets & Sync Capacitor Android
        run: |
          npm run build
          npx cap sync android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Build Universal Debug APK with Gradle
        run: |
          export ANDROID_VERSION_CODE=$((1000 + ${RUN_NUMBER:-1}))
          export ANDROID_VERSION_NAME="5.1.${RUN_NUMBER:-1}"
          echo "Building Universal Debug APK (versionCode=${ANDROID_VERSION_CODE}, versionName=${ANDROID_VERSION_NAME})"

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

          cp app/build/outputs/apk/debug/app-debug.apk SahojDokan.apk
          ls -lh SahojDokan.apk

      - name: Upload SahojDokan.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SahojDokan.apk
          path: android/SahojDokan.apk
          if-no-files-found: error
          compression-level: 0
