name: Build Universal Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Sign Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Capacitor 6
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.3 --save-dev --legacy-peer-deps

      - name: Build Web App
        run: |
          npm run build

      - name: Generate Android Project, Restore Sahoj Dokan Icons & Configure Universal APK
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          # 1. Backup existing custom Sahoj Dokan icons & resources if present
          rm -rf /tmp/saved_android_res
          if [ -d "android/app/src/main/res" ]; then
            cp -r android/app/src/main/res /tmp/saved_android_res
          fi

          # 2. Generate clean Capacitor Android project
          rm -rf android
          node -e '
            const fs = require("fs");
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: "com.sahojdokan.app",
              appName: "Sahoj Dokan",
              webDir: "dist",
              android: { allowMixedContent: true }
            }, null, 2));
          '
          npx cap add android
          npx cap sync android

          # 3. Remove Capacitor default blue-X vector launcher icons so custom PNG icon is always shown
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/drawable-v24
          rm -f android/app/src/main/res/drawable/ic_launcher*

          # 4. Restore backed-up Sahoj Dokan icons & splash screens
          if [ -d "/tmp/saved_android_res" ]; then
            cp -r /tmp/saved_android_res/* android/app/src/main/res/ || true
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            rm -rf android/app/src/main/res/drawable-v24
            rm -f android/app/src/main/res/drawable/ic_launcher*
          fi

          # 5. Also generate all mipmap densities directly from Sahoj Dokan logo using ImageMagick
          ICON_SRC=""
          if [ -f "public/assets/icon.png" ]; then
            ICON_SRC="public/assets/icon.png"
          elif [ -f "assets/icon.png" ]; then
            ICON_SRC="assets/icon.png"
          elif [ -f "public/icon.png" ]; then
            ICON_SRC="public/icon.png"
          fi

          if [ -n "$ICON_SRC" ] && command -v convert >/dev/null 2>&1; then
            for pair in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
              dir="android/app/src/main/res/${pair%%:*}"
              sz="${pair##*:}"
              mkdir -p "$dir"
              convert "$ICON_SRC" -resize "${sz}x${sz}" "$dir/ic_launcher.png"
              convert "$ICON_SRC" -resize "${sz}x${sz}" "$dir/ic_launcher_round.png"
              convert "$ICON_SRC" -resize "${sz}x${sz}" "$dir/ic_launcher_foreground.png"
            done
          fi

          # 6. Install fixed standard Android Debug Keystore (CN=Android Debug,O=Android,C=US)
          KEYSTORE_B64=""
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          echo "$KEYSTORE_B64" | base64 -d > android/app/debug.keystore

          # 7. Configure variables.gradle, app/build.gradle, and clean AndroidManifest.xml
          node -e '
            const fs = require("fs");
            const runNum = parseInt(process.env.RUN_NUM || "1", 10) || 1;
            const verCode = 200 + runNum;

            // Update variables.gradle
            const varsPath = "android/variables.gradle";
            if (fs.existsSync(varsPath)) {
              let vars = fs.readFileSync(varsPath, "utf8");
              vars = vars.replace(/minSdkVersion\s*=\s*\d+/, "minSdkVersion = 21");
              vars = vars.replace(/targetSdkVersion\s*=\s*\d+/, "targetSdkVersion = 33");
              vars = vars.replace(/compileSdkVersion\s*=\s*\d+/, "compileSdkVersion = 34");
              fs.writeFileSync(varsPath, vars, "utf8");
            }

            // Write universal app/build.gradle using standard Android debug signing + v1/v2
            const appGradlePath = "android/app/build.gradle";
            const cleanBuildGradle = `apply plugin: "com.android.application"

          android {
              namespace "com.sahojdokan.app"
              compileSdk rootProject.ext.compileSdkVersion

              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              defaultConfig {
                  applicationId "com.sahojdokan.app"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode ${verCode}
                  versionName "2.0.${runNum}"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  ndk {
                      abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                  }
                  aaptOptions {
                      ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
                  }
              }

              splits {
                  abi {
                      enable false
                  }
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      debuggable true
                  }
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
                  }
              }
          }

          repositories {
              flatDir {
                  dirs "../capacitor-cordova-android-plugins/src/main/libs", "libs"
              }
          }

          dependencies {
              implementation fileTree(include: ["*.jar"], dir: "libs")
              implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
              implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
              implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
              implementation project(":capacitor-android")
              testImplementation "junit:junit:$junitVersion"
              androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
              androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
              implementation project(":capacitor-cordova-android-plugins")
          }

          apply from: "capacitor.build.gradle"
          `;
            fs.writeFileSync(appGradlePath, cleanBuildGradle, "utf8");

            // Write clean AndroidManifest.xml with minimal permissions so Play Protect does not flag it
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            const cleanManifest = `<?xml version="1.0" encoding="utf-8" ?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
              <uses-sdk
                  tools:overrideLibrary="com.getcapacitor.android,org.apache.cordova,androidx.webkit,androidx.activity,androidx.fragment,androidx.core,androidx.appcompat,androidx.coordinatorlayout,androidx.core.splashscreen"
              />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:extractNativeLibs="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|navigation|density"
                      android:name=".MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="\${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
              </application>

              <uses-permission android:name="android.permission.INTERNET" />
          </manifest>
          `;
            fs.writeFileSync(manifestPath, cleanManifest, "utf8");
          '

      - name: Build Universal APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Signed Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SahojDokan-Universal-APK
          path: android/app/build/outputs/apk/debug/*.apk
