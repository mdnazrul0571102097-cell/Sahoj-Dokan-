name: Build Universal Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fresh Build Web Assets
        run: |
          npm ci || npm install
          npm run build
          npx cap sync android || npx cap copy android

      - name: Build, Zipalign & Sign Universal APK with Permanent Keystore
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace --no-daemon

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$ZIPALIGN" -p -f -v 4 "$RAW_APK" aligned.apk || cp "$RAW_APK" aligned.apk

          "$APKSIGNER" sign \
            --ks app/sahojdokan-permanent.p12 \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ../SahojDokan.apk \
            aligned.apk || cp "$RAW_APK" ../SahojDokan.apk

          "$APKSIGNER" verify --verbose --print-certs ../SahojDokan.apk || true

      - name: Upload Single SahojDokan.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SahojDokan.apk
          path: SahojDokan.apk
          compression-level: 0

      - name: Build Signed Android App Bundle (.aab)
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          STORE_PASSWORD=$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')
          KEY_PASSWORD=$(printf '%s' "${KEY_PASSWORD:-$STORE_PASSWORD}" | tr -d '\r\n')

          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing release signing secrets: KEYSTORE, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi

          cd android
          KS_FILE="$PWD/app/release-upload.jks"
          trap 'rm -f "$KS_FILE"' EXIT

          if ! printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 --decode > "$KS_FILE"; then
            echo "::error::Failed to Base64-decode KEYSTORE secret."
            exit 1
          fi

          if ! CERT_INFO=$(keytool -list -v -keystore "$KS_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1); then
            echo "::error::keytool failed to read keystore with STORE_PASSWORD / KEY_ALIAS:"
            echo "$CERT_INFO"
            exit 1
          fi

          if echo "$CERT_INFO" | grep -qi "CN=Android Debug"; then
            echo "::error::The keystore in KEYSTORE is an Android Debug certificate. Google Play requires a non-debug release keystore."
            exit 1
          fi

          export KEYSTORE_FILE="$KS_FILE"
          export STORE_PASSWORD="$STORE_PASSWORD"
          export KEY_ALIAS="$KEY_ALIAS"
          export KEY_PASSWORD="$KEY_PASSWORD"

          ./gradlew bundleRelease --stacktrace --no-daemon

          RAW_AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          cp "$RAW_AAB" ../SahojDokan.aab

          if ! AAB_VERIFY=$(jarsigner -verify -verbose -certs ../SahojDokan.aab 2>&1); then
            echo "::error::jarsigner verification failed on SahojDokan.aab:"
            echo "$AAB_VERIFY"
            exit 1
          fi

          if echo "$AAB_VERIFY" | grep -qi "CN=Android Debug"; then
            echo "::error::Generated SahojDokan.aab is signed with Android Debug! Aborting upload."
            exit 1
          fi
          echo "Verified: SahojDokan.aab is Release-signed (not debug)."

      - name: Upload Signed SahojDokan.aab Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SahojDokan.aab
          path: SahojDokan.aab
          compression-level: 0
          if-no-files-found: error
