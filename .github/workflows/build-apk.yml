name: Build Universal Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Unstripped Universal Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Capacitor 6
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.3 --save-dev --legacy-peer-deps

      - name: Build Full Web Assets
        run: |
          npm run build

      - name: Sync Full Web Assets & Configure Unstripped Universal APK
        run: |
          rm -rf android
          node -e '
            const fs = require("fs");
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: "com.sahojdokan.pos",
              appName: "Sahoj Dokan",
              webDir: "dist",
              android: { allowMixedContent: true }
            }, null, 2));
          '
          npx cap add android
          npx cap sync android

          # Remove Capacitor default blue-X vector launcher icons
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/drawable-v24
          rm -f android/app/src/main/res/drawable/ic_launcher*

          # Generate all mipmap launcher icons directly from Sahoj Dokan logo
          ICON_SRC=""
          if [ -f "public/assets/icon.png" ]; then
            ICON_SRC="public/assets/icon.png"
          elif [ -f "assets/icon.png" ]; then
            ICON_SRC="assets/icon.png"
          elif [ -f "public/icon.png" ]; then
            ICON_SRC="public/icon.png"
          fi

          if [ -n "$ICON_SRC" ] && command -v convert >/dev/null 2>&1; then
            for pair in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
              dir="android/app/src/main/res/${pair%%:*}"
              sz="${pair##*:}"
              mkdir -p "$dir"
              convert "$ICON_SRC" -resize "${sz}x${sz}" "$dir/ic_launcher.png"
              convert "$ICON_SRC" -resize "${sz}x${sz}" "$dir/ic_launcher_round.png"
              convert "$ICON_SRC" -resize "${sz}x${sz}" "$dir/ic_launcher_foreground.png"
            done
          fi

          node -e '
            const fs = require("fs");

            const varsPath = "android/variables.gradle";
            if (fs.existsSync(varsPath)) {
              let vars = fs.readFileSync(varsPath, "utf8");
              vars = vars.replace(/minSdkVersion\s*=\s*\d+/, "minSdkVersion = 21");
              vars = vars.replace(/targetSdkVersion\s*=\s*\d+/, "targetSdkVersion = 33");
              vars = vars.replace(/compileSdkVersion\s*=\s*\d+/, "compileSdkVersion = 34");
              fs.writeFileSync(varsPath, vars, "utf8");
            }

            const appGradlePath = "android/app/build.gradle";
            if (fs.existsSync(appGradlePath)) {
              let g = fs.readFileSync(appGradlePath, "utf8");
              g = g.replace(/versionCode\s+\d+/, "versionCode 500");
              g = g.replace(/versionName\s+"[^"]+"/, "versionName \"5.0.0\"");
              g = g.replace(
                /defaultConfig\s*\{/,
                "splits {\n        abi {\n            enable false\n            universalApk true\n        }\n    }\n    packagingOptions {\n        doNotStrip \"**/*.so\"\n        jniLibs {\n            useLegacyPackaging true\n        }\n    }\n    defaultConfig {\n        ndk {\n            abiFilters \"arm64-v8a\", \"armeabi-v7a\", \"x86\", \"x86_64\"\n        }"
              );
              g = g.replace(
                /buildTypes\s*\{[\s\S]*?\n    \}/,
                "buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n            minifyEnabled false\n            shrinkResources false\n            debuggable true\n        }\n        release {\n            signingConfig signingConfigs.debug\n            minifyEnabled false\n            shrinkResources false\n            debuggable false\n        }\n    }"
              );
              fs.writeFileSync(appGradlePath, g, "utf8");
            }

            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let m = fs.readFileSync(manifestPath, "utf8");
              if (!m.includes("xmlns:tools")) {
                m = m.replace(
                  "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">",
                  "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" xmlns:tools=\"http://schemas.android.com/tools\">\n    <uses-sdk tools:overrideLibrary=\"com.getcapacitor.android,org.apache.cordova,androidx.webkit,androidx.activity,androidx.fragment,androidx.core,androidx.appcompat,androidx.coordinatorlayout,androidx.core.splashscreen\" />"
                );
              }
              m = m.replace(
                "<application",
                "<application android:usesCleartextTraffic=\"true\" android:extractNativeLibs=\"true\""
              );
              fs.writeFileSync(manifestPath, m, "utf8");
            }
          '

      - name: Build Unstripped Universal Release & Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --stacktrace --no-daemon
          mkdir -p app/build/outputs/apk/universal
          cp app/build/outputs/apk/release/*.apk app/build/outputs/apk/universal/SahojDokan-Universal-Release.apk
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/universal/app-debug.apk

      - name: Upload Unstripped Universal APKs
        uses: actions/upload-artifact@v4
        with:
          name: SahojDokan-Universal-APK
          path: android/app/build/outputs/apk/universal/*.apk
