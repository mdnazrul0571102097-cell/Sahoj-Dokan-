name: Build Universal Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Capacitor CLI
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev

      - name: Build Web App
        run: |
          npm run build

      - name: Generate Fresh Android Project & Sync
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Universal APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Signed Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SahojDokan-Universal-APK
          path: android/app/build/outputs/apk/debug/*.apk
