name: Build Universal Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

env:
  RUN_NUMBER: ${{ github.run_number }}
  # Permanent embedded PKCS#12 keystore (Alias: androiddebugkey, Pass: android, SHA1: 8D:27:BE:77:B2:F4:31:9B:27:EE:90:D3:08:95:3C:14:60:4B:FC:F7)
  PERMANENT_KEYSTORE_BASE64: ""

jobs:
  build:
    name: Build & Sign Universal Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Capacitor 6
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.3 --save-dev --legacy-peer-deps

      - name: Build Full Web Assets & Sync Capacitor Android
        run: |
          npm run build
          npx cap sync android
          # Remove adaptive vector overrides if recreated by sync so properly-sized PNG mipmaps are used
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Build Unsigned Universal Release APK, Zipalign FIRST, & Sign SECOND with Permanent Keystore
        run: |
          export ANDROID_VERSION_CODE=$((1000 + ${RUN_NUMBER:-1}))
          export ANDROID_VERSION_NAME="5.1.${RUN_NUMBER:-1}"
          echo "Building Sahoj Dokan APK with versionCode=${ANDROID_VERSION_CODE}, versionName=${ANDROID_VERSION_NAME}"

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

          # Restore the permanent keystore (use project-level keystore or decode embedded Base64 keystore)
          KEYSTORE_PATH="app/sahojdokan-permanent.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "$PERMANENT_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          fi

          # Locate zipalign and apksigner from Android SDK build-tools
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          # Locate the unsigned release APK produced by Gradle
          INPUT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found input APK: $INPUT_APK"

          # STEP 1: Execute zipalign FIRST (never sign before align)
          "$ZIPALIGN" -v -p 4 "$INPUT_APK" aligned.apk

          # STEP 2: Execute apksigner SECOND on aligned.apk using the permanent keystore (v1 + v2 + v3 enabled)
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out SahojDokan-Release.apk \
            aligned.apk

          # Verify alignment and confirm permanent certificate fingerprint
          "$ZIPALIGN" -c -v 4 SahojDokan-Release.apk
          "$APKSIGNER" verify --verbose --print-certs SahojDokan-Release.apk
          ls -lh SahojDokan-Release.apk

      - name: Upload SahojDokan-Release.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SahojDokan-Release.apk
          path: android/SahojDokan-Release.apk
          if-no-files-found: error
          compression-level: 0
