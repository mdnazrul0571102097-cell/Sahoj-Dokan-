name: Build Universal Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build, Zipalign & Sign Universal APK with Permanent Keystore
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace --no-daemon

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$ZIPALIGN" -p -f -v 4 "$RAW_APK" aligned.apk

          "$APKSIGNER" sign \
            --ks app/sahojdokan-permanent.p12 \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ../SahojDokan.apk \
            aligned.apk

          "$APKSIGNER" verify --verbose --print-certs ../SahojDokan.apk

      - name: Upload Single SahojDokan.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SahojDokan.apk
          path: SahojDokan.apk
          compression-level: 0
