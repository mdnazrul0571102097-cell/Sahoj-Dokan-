name: Build Universal Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Universal Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk SahojDokan.apk
          elif [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew clean assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk ../SahojDokan.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SahojDokan.apk
          path: SahojDokan.apk
