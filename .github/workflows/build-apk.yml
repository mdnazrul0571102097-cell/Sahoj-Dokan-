name: Build Universal Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Sign Universal Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Capacitor 6
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.3 --save-dev --legacy-peer-deps

      - name: Build Full Web Assets
        run: |
          npm run build

      - name: Sync Web Assets, Set App Icon & Configure Unstripped Universal APK
        run: |
          # Backup existing pre-resized mipmap icons if present in repo
          rm -rf /tmp/saved_mipmaps
          mkdir -p /tmp/saved_mipmaps
          if [ -d "android/app/src/main/res" ]; then
            cp -r android/app/src/main/res/mipmap-* /tmp/saved_mipmaps/ 2>/dev/null || true
          fi

          rm -rf android
          node -e '
            const fs = require("fs");
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: "com.sahojdokan.pos",
              appName: "Sahoj Dokan",
              webDir: "dist",
              android: { allowMixedContent: true }
            }, null, 2));
          '
          npx cap add android
          npx cap sync android

          # Remove Capacitor default blue-X vector launcher icons completely
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/drawable-v24
          rm -f android/app/src/main/res/drawable/ic_launcher*

          # Restore backed-up mipmap folders
          cp -r /tmp/saved_mipmaps/mipmap-* android/app/src/main/res/ 2>/dev/null || true
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # Guaranteed Node.js icon copy fallback (no external tools required)
          node -e '
            const fs = require("fs");
            const path = require("path");
            const iconCandidates = ["public/assets/icon.png", "assets/icon.png", "public/icon.png"];
            const srcIcon = iconCandidates.find(p => fs.existsSync(p));
            if (srcIcon) {
              const densities = ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"];
              for (const d of densities) {
                const dir = path.join("android/app/src/main/res", d);
                fs.mkdirSync(dir, { recursive: true });
                fs.copyFileSync(srcIcon, path.join(dir, "ic_launcher.png"));
                fs.copyFileSync(srcIcon, path.join(dir, "ic_launcher_round.png"));
                fs.copyFileSync(srcIcon, path.join(dir, "ic_launcher_foreground.png"));
              }
            }

            // Configure variables.gradle
            const varsPath = "android/variables.gradle";
            if (fs.existsSync(varsPath)) {
              let vars = fs.readFileSync(varsPath, "utf8");
              vars = vars.replace(/minSdkVersion\s*=\s*\d+/, "minSdkVersion = 21");
              vars = vars.replace(/targetSdkVersion\s*=\s*\d+/, "targetSdkVersion = 33");
              vars = vars.replace(/compileSdkVersion\s*=\s*\d+/, "compileSdkVersion = 34");
              fs.writeFileSync(varsPath, vars, "utf8");
            }

            // Write complete unstripped Universal build.gradle (minifyEnabled false, shrinkResources false)
            const gradleContent = `apply plugin: "com.android.application"

          android {
              namespace "com.sahojdokan.pos"
              compileSdk rootProject.ext.compileSdkVersion

              defaultConfig {
                  applicationId "com.sahojdokan.pos"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 500
                  versionName "5.0.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  ndk {
                      abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
                  }
                  aaptOptions {
                      ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
                  }
              }

              splits {
                  abi {
                      enable false
                      universalApk true
                  }
              }

              packagingOptions {
                  doNotStrip "**/*.so"
                  jniLibs {
                      useLegacyPackaging true
                  }
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                      debuggable false
                  }
              }
          }

          repositories {
              flatDir {
                  dirs "../capacitor-cordova-android-plugins/src/main/libs", "libs"
              }
          }

          dependencies {
              implementation fileTree(include: ["*.jar"], dir: "libs")
              implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
              implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
              implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
              implementation project(":capacitor-android")
              testImplementation "junit:junit:$junitVersion"
              androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
              androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
              implementation project(":capacitor-cordova-android-plugins")
          }

          apply from: "capacitor.build.gradle"
          `;
            fs.writeFileSync("android/app/build.gradle", gradleContent, "utf8");

            // Update AndroidManifest.xml
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let m = fs.readFileSync(manifestPath, "utf8");
              if (!m.includes("xmlns:tools")) {
                m = m.replace(
                  "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">",
                  "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" xmlns:tools=\"http://schemas.android.com/tools\">\n    <uses-sdk tools:overrideLibrary=\"com.getcapacitor.android,org.apache.cordova,androidx.webkit,androidx.activity,androidx.fragment,androidx.core,androidx.appcompat,androidx.coordinatorlayout,androidx.core.splashscreen\" />"
                );
              }
              m = m.replace(
                "<application",
                "<application android:usesCleartextTraffic=\"true\" android:extractNativeLibs=\"true\""
              );
              fs.writeFileSync(manifestPath, m, "utf8");
            }
          '

      - name: Build Unstripped Universal Release APK & Digitally Sign with apksigner
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

          # 1. Auto-generate standard Debug Keystore using JDK keytool
          rm -f debug-signing.keystore
          keytool -genkeypair -v \
            -keystore debug-signing.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # 2. Locate zipalign and apksigner from Android SDK build-tools
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          # 3. Find the built release APK and zipalign it
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$ZIPALIGN" -p -f -v 4 "$RAW_APK" aligned-universal.apk

          # 4. Digitally sign with apksigner (v1 + v2 + v3 schemes enabled) into single SahojDokan-Signed-Universal.apk
          mkdir -p signed-output
          "$APKSIGNER" sign \
            --ks debug-signing.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out signed-output/SahojDokan-Signed-Universal.apk \
            aligned-universal.apk

          # 5. Verify signature
          "$APKSIGNER" verify --verbose signed-output/SahojDokan-Signed-Universal.apk

      - name: Upload Single Signed Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: SahojDokan-Signed-Universal-APK
          path: android/signed-output/SahojDokan-Signed-Universal.apk
