name: Generate Keystore One Time

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Enter ONE strong password (at least 6 characters, save it safely!)'
        required: true
        type: string

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Release Keystore & Base64
        env:
          KEYSTORE_PASSWORD: ${{ inputs.keystore_password }}
        run: |
          echo "::add-mask::$KEYSTORE_PASSWORD"

          if [ "${#KEYSTORE_PASSWORD}" -lt 6 ]; then
            echo "::error::Password must be at least 6 characters long for Java keytool."
            exit 1
          fi

          mkdir -p keystore-output

          keytool -genkeypair \
            -keystore keystore-output/sahojdokan-release.jks \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias sahojdokan-release \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Sahoj Dokan, OU=Mobile, O=Sahoj Dokan, L=Dhaka, ST=Dhaka, C=BD"

          base64 -w 0 keystore-output/sahojdokan-release.jks > keystore-output/keystore_base64.txt

          echo "Keystore and Base64 file generated successfully."

      - name: Upload sahojdokan-release.jks Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahojdokan-release.jks
          path: keystore-output/sahojdokan-release.jks
          retention-days: 1
          if-no-files-found: error

      - name: Upload keystore_base64.txt Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore_base64.txt
          path: keystore-output/keystore_base64.txt
          retention-days: 1
          if-no-files-found: error
